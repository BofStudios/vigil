name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: build
        run: dotnet build Vigil.sln -c Release

      - name: tests
        run: dotnet test Vigil.sln -c Release --no-build

      - name: the window draws every state
        shell: pwsh
        run: |
          Start-Process src\Vigil\bin\Release\net8.0-windows10.0.19041.0\win-x64\Vigil.exe -ArgumentList "--preview", "$PWD\preview" -Wait
          $count = (Get-ChildItem preview -Filter *.png).Count
          if ($count -lt 7) { throw "only $count states were drawn" }

      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview
