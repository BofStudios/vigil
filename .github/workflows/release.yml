name: release

# Builds what a person downloads. Runs on a tag, and can be run by hand from the
# Actions tab to check a build without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-app:
    name: windows application
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: tests
        run: dotnet test Vigil.sln -c Release

      - name: read the version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Vigil/Vigil.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: publish a single Vigil.exe
        run: dotnet publish src/Vigil/Vigil.csproj -c Release -o dist/Vigil

      - name: portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/Vigil/Vigil.exe -DestinationPath dist/Vigil-${{ steps.version.outputs.version }}-windows-portable.zip

      # Inno Setup is already on the windows runners.
      - name: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} packaging\vigil.iss

      - uses: actions/upload-artifact@v4
        with:
          name: vigil-windows
          path: |
            dist/*.zip
            dist/*-setup.exe

      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
