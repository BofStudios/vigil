[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil-cli"
version = "0.3.0"
description = "A free, terminal-native AI agent that operates your computer - with a security layer that never disables your protections."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BOF Studios" }]
keywords = ["ai", "agent", "cli", "automation", "groq", "llm", "assistant", "computer-use"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "groq>=0.11.0",
  "rich>=13.7.0",
  "prompt_toolkit>=3.0.43",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
gui = [
  "pyautogui>=0.9.54",
  "pillow>=10.0.0",
  "mss>=9.0.1",
  "pyperclip>=1.8.2",
  "pygetwindow>=0.0.9; sys_platform == 'win32'",
]
browser = ["playwright>=1.44.0"]
desktop = ["pywebview>=5.0"]
all = [
  "pyautogui>=0.9.54",
  "pillow>=10.0.0",
  "mss>=9.0.1",
  "pyperclip>=1.8.2",
  "pygetwindow>=0.0.9; sys_platform == 'win32'",
  "playwright>=1.44.0",
  "pywebview>=5.0",
]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.urls]
Homepage = "https://github.com/BofStudios/vigil"
Repository = "https://github.com/BofStudios/vigil"
Issues = "https://github.com/BofStudios/vigil/issues"

[project.scripts]
vigil = "vigil.cli:main"

[project.gui-scripts]
vigil-app = "vigil.desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["vigil"]

[tool.hatch.build.targets.wheel.force-include]
"vigil/desktop/web" = "vigil/desktop/web"
"vigil/assets" = "vigil/assets"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP007", "UP045"]  # Optional[X] kept for 3.9 compatibility

[tool.pytest.ini_options]
testpaths = ["tests"]
