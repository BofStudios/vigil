[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil-cli"
dynamic = ["version"]
description = "A free, terminal-native AI agent that operates your computer - with a security layer that never disables your protections."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BOF Studios" }]
keywords = ["ai", "agent", "cli", "automation", "groq", "llm", "assistant", "computer-use"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "groq>=0.11.0",
  "rich>=13.7.0",
  "prompt_toolkit>=3.0.43",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
gui = [
  "pyautogui>=0.9.54",
  "pillow>=10.0.0",
  "mss>=9.0.1",
  "pyperclip>=1.8.2",
  "pygetwindow>=0.0.9; sys_platform == 'win32'",
]
claude = ["anthropic>=0.40"]
browser = ["playwright>=1.44.0"]
voice = ["sounddevice>=0.4.6", "pynput>=1.7"]
desktop = [
  "pywebview>=5.0",
  "pystray>=0.19",
  "pillow>=10.0.0",
  # Windows has RegisterHotKey; everywhere else needs this for the summon key
  "pynput>=1.7",
  "sounddevice>=0.4.6",
]
all = [
  "anthropic>=0.40",
  "pyautogui>=0.9.54",
  "pillow>=10.0.0",
  "mss>=9.0.1",
  "pyperclip>=1.8.2",
  "pygetwindow>=0.0.9; sys_platform == 'win32'",
  "playwright>=1.44.0",
  "pywebview>=5.0",
  "pystray>=0.19",
  "pynput>=1.7",
  "sounddevice>=0.4.6",
]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.urls]
Homepage = "https://github.com/BofStudios/vigil"
Repository = "https://github.com/BofStudios/vigil"
Issues = "https://github.com/BofStudios/vigil/issues"

[project.scripts]
vigil = "vigil.cli:main"

[project.gui-scripts]
vigil-app = "vigil.desktop.app:main"

# One source of truth for the version: the package itself.
[tool.hatch.version]
path = "vigil/__init__.py"

[tool.hatch.build.targets.wheel]
# The front end and the icons live inside the package directory, so they are
# already carried. Forcing them in as well added every one of them twice and
# the wheel would not build at all.
packages = ["vigil"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP007", "UP045"]  # Optional[X] kept for 3.9 compatibility

[tool.pytest.ini_options]
testpaths = ["tests"]
