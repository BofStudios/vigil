<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell resting" id="shell">

  <!-- ------------------------------------------------------------- bar -->
  <div class="bar" id="bar">
    <div class="grip drag-region" id="grip" title="Drag to move">
      <svg class="mark" viewBox="0 0 256 256" aria-hidden="true">
        <path d="M73.7 81.4 L128 179.2 L182.3 81.4" fill="none" stroke="currentColor"
              stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- the same stroke again, brighter, with a short dash that travels
             along it while Vigil is working: light moving over metal -->
        <path class="trace" d="M73.7 81.4 L128 179.2 L182.3 81.4" pathLength="100"
              fill="none" stroke="#ffffff" stroke-width="21" stroke-linecap="round"
              stroke-linejoin="round" stroke-dasharray="14 86"/>
        <circle cx="128" cy="115.7" r="12.3" fill="currentColor"/>
      </svg>
      <span class="pulse" id="pulse" hidden></span>
    </div>

    <span class="pill-hint" id="pill-hint">Vigil</span>
    <span class="voice-hint" id="voice-hint" hidden>
      <span class="levels"><i></i><i></i><i></i><i></i></span>
      <span id="voice-text">Listening</span>
    </span>

    <textarea id="input" rows="1" spellcheck="false" autocomplete="off"
              placeholder="Ask Vigil anything…"></textarea>

    <div class="bar-actions">
      <button class="mode-dot" id="chip-mode" title="Approval mode"><i></i></button>
      <button class="round send" id="send" aria-label="Send">
        <svg viewBox="0 0 20 20"><path d="M10 16V5m0 0L5.5 9.5M10 5l4.5 4.5"
          stroke="currentColor" stroke-width="1.9" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="round stop" id="stop" hidden aria-label="Stop">
        <svg viewBox="0 0 20 20"><rect x="6.5" y="6.5" width="7" height="7" rx="1.8"
          fill="currentColor"/></svg>
      </button>
      <button class="round ghost" id="win-close" aria-label="Hide to tray" title="Hide (Esc)">
        <svg viewBox="0 0 20 20"><path d="M6.5 6.5l7 7M13.5 6.5l-7 7" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- ----------------------------------------------------------- panel -->
  <div class="panel" id="panel">

    <div class="tabrow" id="tabrow"></div>

    <div class="plan-strip" id="plan-strip" hidden>
      <div class="plan-top">
        <span class="plan-label">Plan</span>
        <span class="plan-count" id="plan-count">0/0</span>
        <div class="plan-track"><i id="plan-bar"></i></div>
      </div>
      <ol class="plan-list" id="plan-list"></ol>
    </div>

    <div class="stream" id="stream"></div>

    <div class="footer">
      <button class="chip" id="chip-brain" title="How Vigil thinks"><span id="brain-label">—</span></button>
      <button class="chip" id="chip-model"><span id="model-label">—</span></button>
      <button class="chip chip-path" id="chip-cwd">
        <svg viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 013.5 3h2.6l1.2 1.5h5.2A1.5 1.5 0 0114 6v5.5A1.5 1.5 0 0112.5 13h-9A1.5 1.5 0 012 11.5z"
          fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span id="cwd-label">—</span>
      </button>
      <span class="footer-gap"></span>
      <span class="chip ghost" id="chip-tokens" hidden></span>
      <button class="chip ghost" id="chip-tools"><span id="tools-label">—</span></button>
      <button class="chip ghost" id="btn-new" title="New session (Ctrl+T)">+</button>
    </div>
  </div>
</div>

<!-- --------------------------------------------------------------- modal -->
<div class="scrim" id="scrim" hidden>
  <div class="dialog" id="approval" role="dialog" aria-modal="true">
    <div class="dialog-head">
      <span class="risk" id="approval-risk">moderate</span>
      <span class="dialog-tool" id="approval-tool"></span>
    </div>
    <p class="dialog-title" id="approval-summary"></p>
    <p class="dialog-sub" id="approval-reason"></p>
    <pre class="dialog-detail" id="approval-detail"></pre>
    <div class="dialog-actions">
      <button class="key allow" id="btn-yes"><kbd>Y</kbd>Allow</button>
      <button class="key deny" id="btn-no"><kbd>N</kbd>Deny</button>
      <button class="key soft" id="btn-always"><kbd>A</kbd>Always</button>
    </div>
  </div>

  <div class="dialog sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="dialog-head">
      <span class="dialog-tool" id="sheet-title">Models</span>
      <button class="round ghost tiny" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 20 20"><path d="M6.5 6.5l7 7M13.5 6.5l-7 7" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
